<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Calculadora Basal</title>
<body>
    
    <fieldset>
        <div class="legenda1"><legend>Calculadora de Taxa Metabólica Basal</legend></div>
         
        <div>
        
        <h2>Nível de Atividade Fisica</h2>
        <br />

        <input type="checkbox" name="sedentario"> Sedentário 1.4
        <input type="checkbox" name="moderado"> Moderado 1.6
        <input type="checkbox" name="intenso"> Intenso 1.8
        </div>

        <h2 class="nivel">Digite sua idade</h2>

        <input class="nome" type="number" name="idade" id="IdAdE">
        <br />

        <h2 class="nivel">Digite Seu Peso</h2>

        <input class="nome" type="number" name="numero" id="NuMeRo">
        <br /> <br />
        

        <div class="button">
        <button>Calcular</button>
        <button>Apagar</button>
        </div>
      

    </fieldset>
</body>
</html>
