<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Calculadora TMB</title>
<body>
    
    <fieldset>
        <form action="" method="get" id="myform">
        <div class="legenda1"><legend>Calculadora de Taxa Metabólica Basal</legend></div>
         
        <br>
        <div class="alinha">
        <input type="radio" id="sexo_masculino" name="sexo" value="MASCULINO">
        <label for="sexo_masculino">Masculino</label>

        <input type="radio" id="sexo_feminino" name="sexo" value="FEMININO">
        <label for="sexo_feminino">Feminino</label>
        </div>  

        <h2 class="input">Digite sua idade</h2>

        <label for="Digite_idade">
        <input class="nome" type="number" id="idade" name="idade_usuario">
        <br />

        <h2 class="input">Digite sua altura</h2>

        <label for="Digite_altura">
        <input class="nome" type="number" id="altura" name="altura_usuario">
        </label>
        <br />

        <h2 class="input">Digite Seu Peso</h2>

        <label for="Digite_peso">
        <input class="nome" type="number" id="peso" name="peso_usuario">
        </label>
        <br /> <br />
        

        <div class="butto">
        <button type="submit" id="calcularBtn">Calcular</button>
        <button type="reset" id="apagarBtn">Apagar</button>
        </div>
  
        

    </fieldset>
    </form>
     <script src="js/CalcuTmB.js"></script>
</body>
</html>
