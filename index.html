<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Calculadora TMB</title>
<body>
    
    <fieldset>
        <div class="legenda1"><legend>Calculadora de Taxa Metabólica Basal</legend></div>
         
        <h2>Nível de Atividade Fisica</h2>

        <input type="radio" name="atividade"> Sedentário 1.2
        <input type="radio" name="atividade"> Moderado 1.5
        <input type="radio" name="atividade"> Atleta 1.9

        <h2 class="sexo"> Selecione o sexo</h2>

        <div class="alinha">
        <input type="radio" name="sexo" value="M">Masculino
        <input type="radio" name="sexo" value="F">Feminino
        </div>

        <h2 class="input">Digite sua idade</h2>

        <input class="nome" type="number" name="idade" id="IdAdE">
        <br />

        <h2 class="input">Digite sua altura</h2>

        <input class="nome" type="number" name="altura" id="AlTuRa">
        <br />

        <h2 class="input">Digite Seu Peso</h2>

        <input class="nome" type="number" name="numero" id="NuMeRo">
        <br /> <br />
        

        <div class="button">
        <button>Calcular</button>
        <button>Apagar</button>
        </div>
      

    </fieldset>
</body>
</html>
